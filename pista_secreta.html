<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>UPDATE v3.0</title>
<style>
body {
    background: #0d0f1a;
    color: #e6e6e6;
    font-family: monospace;
    text-align: center;
    padding: 40px;
}

.box {
    border: 1px solid #333;
    padding: 20px;
    margin: 20px auto;
    max-width: 600px;
}

input {
    padding: 10px;
    width: 60%;
    margin-top: 10px;
    background: #111;
    border: 1px solid #444;
    color: white;
}

button {
    padding: 10px 15px;
    margin-top: 10px;
    background: #222;
    border: 1px solid #555;
    color: white;
    cursor: pointer;
}

.achievements {
    text-align: left;
    margin-top: 20px;
    font-size: 14px;
}

.achievement {
    margin: 5px 0;
    opacity: 0.8;
}
</style>
</head>

<body>

<h1>UPDATE v3.0</h1>

<div class="box">
<p id="progress">Fragmentos recuperados: 0/5</p>

<p>Introduce código:</p>
<input id="code" placeholder="XXXXXX">
<br>
<button onclick="checkCode()">Enviar</button>

<p id="msg"></p>
</div>

<div class="box">
<h3>🏆 Logros Steam</h3>
<div class="achievements" id="achievements"></div>
</div>

<script>
let fragments = 0;

function addAchievement(text) {
    let div = document.createElement("div");
    div.className = "achievement";
    div.innerText = "🏆 " + text;
    document.getElementById("achievements").appendChild(div);
}

function checkCode() {
    let code = document.getElementById("code").value.toUpperCase();

    let msg = document.getElementById("msg");

    if (code === "DISNEY") {
        fragments = 1;
        msg.innerText = "Fragmento 1 recuperado: Disneyland";
        addAchievement("Mouse Ears Acquired (+10 XP)");
    }

    else if (code === "CAMPAMENTO") {
        fragments = 2;
        msg.innerText = "Fragmento 2 recuperado: Campamento de música";
        addAchievement("Summer Rhythm (+10 XP)");
    }

    else if (code === "CALAHONDA") {
        fragments = 3;
        msg.innerText = "Fragmento 3 recuperado: Veranos en Calahonda";
        addAchievement("Sand Everywhere (+10 XP)");
    }

    else if (code === "ANIMAR") {
        fragments = 4;
        msg.innerText = "Fragmento 4 recuperado: Animación 2D";
        addAchievement("Frame by Frame (+10 XP)");
    }

    else if (code === "PIXEL") {
        fragments = 5;
        msg.innerText = "Sistema completo. Versión 3.0 activada.";
        addAchievement("FULL RELEASE UNLOCKED (+50 XP)");
        setTimeout(() => {
            alert("REGALO DESBLOQUEADO: ve al escondite final 🎁");
        }, 1000);
    }

    else {
        msg.innerText = "Código incorrecto...";
    }

    document.getElementById("progress").innerText =
        "Fragmentos recuperados: " + fragments + "/5";
}
</script>

</body>
</html>
