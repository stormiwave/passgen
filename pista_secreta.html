<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UPDATE v3.0</title>

<style>
:root{
    --bg:#0d1117;
    --panel:#161b22;
    --border:#30363d;
    --text:#e6edf3;
    --accent:#58a6ff;
    --success:#3fb950;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: Consolas, Monaco, monospace;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

h1{
    text-align:center;
    margin-top:0;
    color:var(--accent);
}

.progress{
    font-size:22px;
    text-align:center;
    margin:15px 0;
}

.mission{
    line-height:1.8;
    white-space:pre-line;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#0d1117;
    color:white;
    font-size:18px;
}

button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.achievement{
    padding:10px;
    margin:8px 0;
    border-left:4px solid #666;
    opacity:0.4;
}

.unlocked{
    border-left-color:gold;
    opacity:1;
}

.log{
    background:#0b0f14;
    padding:15px;
    border-radius:8px;
    font-size:14px;
    margin-top:15px;
}

.success{
    color:var(--success);
    font-weight:bold;
}

.final{
    text-align:center;
    font-size:24px;
    color:gold;
}
</style>
</head>
<body>

<div class="container">

<div class="card">
<h1>UPDATE v3.0</h1>

<div id="progress" class="progress">
░░░░░ 0/5
</div>

<div id="mission" class="mission"></div>

<input id="codeInput"
placeholder="Introduce código">

<button onclick="submitCode()">
Enviar
</button>

</div>

<div class="card">
<h2>🏆 Logros</h2>

<div id="ach1" class="achievement">
Mouse Ears Acquired
</div>

<div id="ach2" class="achievement">
Summer Rhythm
</div>

<div id="ach3" class="achievement">
Sand Everywhere
</div>

<div id="ach4" class="achievement">
Frame By Frame
</div>

<div id="ach5" class="achievement">
Full Release Unlocked
</div>

</div>

<div class="card">
<h2>📜 Log del sistema</h2>
<div id="log" class="log"></div>
</div>

</div>

<script>

const stages = [

{
mission:
`ERROR DETECTADO

Se han perdido 5 fragmentos de memoria.

Sin ellos la actualización no podrá completarse.

━━━━━━━━━━━━━━

MISIÓN ACTIVA

"Donde los sueños eran reales."

Busca el castillo.`,
code:"DISNEY"
},

{
mission:
`FRAGMENTO RECUPERADO

Disneyland restaurado correctamente.

━━━━━━━━━━━━━━

MISIÓN ACTIVA

Qué bien sonaban aquellos veranos.

Busca donde el sonido duerme.`,
code:"CAMPAMENTO"
},

{
mission:
`ERROR DETECTADO

Todavía hay arena en el sistema.

Se siguen encontrando granos de arena
en lugares imposibles.

━━━━━━━━━━━━━━

Busca donde el verano nunca termina.`,
code:"CALAHONDA"
},

{
mission:
`Detectando creatividad...

✓ Diseñadora gráfica
✓ Animadora 2D

━━━━━━━━━━━━━━

Los frames están desordenados.

Busca donde nacen los dibujos.`,
code:"ANIMAR"
},

{
mission:
`Detectando perfil...

✓ Diseñadora
✓ Animadora
✓ Programadora web
✓ Jugadora de videojuegos indie

━━━━━━━━━━━━━━

Falta un último fragmento.

Busca donde viven miles de historias dibujadas.`,
code:"PIXEL"
}

];

let progress =
parseInt(localStorage.getItem("update_v30_progress")) || 0;

render();

function submitCode(){

const input =
document.getElementById("codeInput");

const value =
input.value.trim().toUpperCase();

if(progress >= stages.length){
return;
}

if(value === stages[progress].code){

progress++;

localStorage.setItem(
"update_v30_progress",
progress
);

render();

}else{

alert("Código incorrecto");
}

input.value="";
}

function render(){

const mission =
document.getElementById("mission");

const progressBar =
document.getElementById("progress");

const log =
document.getElementById("log");

let bar =
"█".repeat(progress) +
"░".repeat(5-progress);

progressBar.innerHTML =
`${bar} ${progress}/5`;

for(let i=1;i<=5;i++){

const ach =
document.getElementById("ach"+i);

if(i<=progress){
ach.classList.add("unlocked");
}
}

if(progress < 5){

mission.innerText =
stages[progress].mission;

}else{

mission.innerHTML =
`
<div class="final">

████████████████

UPDATE COMPLETADA

████████████████

<br><br>

🏆 FULL RELEASE UNLOCKED

<br><br>

VERSIÓN 3.0 INSTALADA

<br><br>

🎁 REGALO DESBLOQUEADO

<br><br>

VE A:

<b>DEBAJO DE LA HAMACA</b>

</div>
`;

}

let entries = [];

if(progress >= 1)
entries.push("memory_disney.dll loaded");

if(progress >= 2)
entries.push("music_camp.exe loaded");

if(progress >= 3)
entries.push("summer_memory.pkg loaded");

if(progress >= 4)
entries.push("animation_engine.sys loaded");

if(progress >= 5)
entries.push("personality_core.sys loaded");

if(progress >= 5)
entries.push("update_success = true");

log.innerHTML =
entries.join("<br>");
}

</script>

</body>
</html>
